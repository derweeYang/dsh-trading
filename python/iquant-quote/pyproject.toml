[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "dsh-iquant-quote"
version = "0.0.0.dev0"
description = "Local HTTP/CLI gateway wrapping iquant.quote.QuoteClient"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
dsh-iquant-quote = "dsh_iquant_quote.cli:main"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_iquant_quote"]
