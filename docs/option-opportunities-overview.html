function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function para(s){ return (s||'').split('\n').filter(function(x){return x.trim().length;}).map(function(x){return '<p class="para">'+esc(x)+'</p>';}).join(''); }
function olSteps(s){
  const lines=(s||'').split('\n').filter(function(x){return x.trim().length;});
  if(!lines.length) return '';
  return '<ol class="ol">'+lines.map(function(x){return '<li>'+esc(x).replace(/^【([^】]+)】/,'<b>【$1】</b> ')+'</li>';}).join('')+'</ol>';
}
